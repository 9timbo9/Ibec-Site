<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us!</title>
    <link rel="stylesheet" href="template.css"> 
    <link rel="icon" href="images/logo.png" type="image/x-icon">
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            fetch('template.html') 
                .then(response => response.text())
                .then(data => {
                    document.querySelector('.header-placeholder').innerHTML = data;
                })
                .catch(error => console.log('Error loading template:', error));
        });
        
        window.addEventListener('scroll', function() {
            const footer = document.querySelector('.footer');
            const scrollPosition = window.scrollY + window.innerHeight;
            const documentHeight = document.documentElement.scrollHeight;

            if (scrollPosition >= documentHeight) {
                footer.style.bottom = '0'; 
            } else {
                footer.style.bottom = '-100px'; 
            }
        });

        function initMap() {
            const location = { lat: 44.0444, lng: -123.0726 }; 
            const map = new google.maps.Map(document.getElementById("map"), {
                zoom: 15,
                center: location,
            });
            const marker = new google.maps.Marker({
                position: location,
                map: map,
            });
        }

    </script>
</head>
<body>
    <div class="header-placeholder"></div>
    <div class="container">
        <h1>Contact Us</h1>
        <p>If you have any questions, feel free to reach out to us!</p>

        <h2>Where We Meet</h2>
        <p>We meet every Thursday at 6 PM in the Lillis Business Complex, Room 112, at the University of Oregon.</p>

        <h2>Agghghhhhgghhgghhghghghghghhhhgggh</h2>
        
        <h2>Find Us Here</h2>
        <div id="map" style="width: 100%; height: 400px; margin-top: 20px;"></div>

        <h2>Follow Us</h2>
        <p>
            <a href="https://www.instagram.com/uo.ibec/?hl=en" target="_blank">Instagram</a><br>
            <a href="https://www.linkedin.com/company/uo-ibec" target="_blank">LinkedIn</a>
        </p>
    </div>
</body>
</html>
